<head>

<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-28">
<header class="sticky top-0 z-40 bg-blue-700 text-white shadow-md">
  <div class="max-w-md md:max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div>
      <span class="text-[10px] bg-blue-500 text-blue-100 font-bold px-2 py-0.5 rounded-full">TesterViet x PRDCV</span>
      <h1 class="text-base font-bold leading-tight mt-0.5">Control Center</h1>
      <button id="saveStatus" type="button" onclick="showSaveDetails()" class="text-[10px] text-blue-100 text-left" aria-live="polite"></button>
    </div>
    <div id="accountActions" class="flex items-center gap-2" style="display:none">
      <button id="logoutButton" onclick="logoutLocalAccount()" class="bg-blue-600 hover:bg-blue-500 rounded-full px-3 py-2 text-xs font-semibold"><i class="fa-solid fa-right-from-bracket mr-1"></i>Đăng xuất</button>
      <button id="notificationsButton" onclick="openNotifications()" aria-label="Thông báo quan trọng" class="relative w-9 h-9 bg-blue-600 hover:bg-blue-500 rounded-full text-xs"><i class="fa-solid fa-bell"></i><span id="notificationCount" class="absolute -top-1 -right-1 min-w-4 h-4 px-1 rounded-full bg-rose-500 text-white text-[9px] font-bold leading-4"></span></button>
      <button id="settingsButton" onclick="openSettings()" aria-label="Cài đặt" class="w-9 h-9 bg-blue-600 hover:bg-blue-500 rounded-full text-xs"><i class="fa-solid fa-gear"></i></button>
    </div>
  </div>
</header>
<main id="app" class="max-w-md md:max-w-6xl mx-auto p-4 space-y-4"></main>
<nav id="nav" class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200"></nav>
<div id="m" class="fixed inset-0 bg-slate-900/60 z-50 items-center justify-center p-4" style="display:none">
  <div id="mb" class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl space-y-3 max-h-[90vh] overflow-y-auto text-xs"></div>
</div>
<datalist id="names"></datalist>

<script>
/* ============ DỮ LIỆU ============ */
const KEY = 'prdcv2';
const AUTH_KEY = 'prdcv2_local_auth';
const O = {
  qc: ['Chờ duyệt', 'Đạt chuẩn', 'Cần quay lại'],
  up: ['Chưa upload', 'Đã upload'],
  ls: ['Chưa gán', 'Đang gán', 'Đã xong', 'Cần sửa'],
  ac: ['Chờ nghiệm thu', 'Đã nghiệm thu', 'Cần sửa lại'],
  pd: ['Chưa chi', 'Đã chi'],
  dv: ['Chờ kiểm tra', 'Hoạt động tốt', 'Có lỗi', 'Đã trả'],
  lv: ['Cao', 'Trung bình', 'Thấp'],
  rs: ['Chưa giải quyết', 'Đang xử lý', 'Đã giải quyết'],
  src: ['Nội bộ', 'Người giới thiệu', 'Facebook / khác'],
  cam: ['L6169', 'L6170'],
  yn: ['Chưa hỏi', 'Không', 'Có', 'Không rõ'],
  why: ['Dính 2 hàm', 'Cắt nửa răng', 'Lóa / ánh sáng', 'Mờ / mất nét', 'Camera nghiêng / quá nhanh', 'Lỗi thiết bị', 'Khác']
};
const QS = [['q1', 'Răng sứ cả hàm?'], ['q2', 'Đang niềng răng?'], ['q3', 'Mất nhiều răng?'], ['q4', 'Sâu răng?'], ['q5', 'Răng quá khấp khểnh / lệch?']];
const SCHEMA_VERSION = 4;
function scr(p) { const a = QS.map(q => p[q[0]] || 'Chưa hỏi'); return a.includes('Có') ? 'Nghi không đủ' : a.every(x => x === 'Không') ? 'Đủ ĐK' : a.every(x => x === 'Chưa hỏi') ? 'Chưa sàng lọc' : 'Cần hỏi thêm'; }
const f = (k, l, t = 'text', o) => ({ k, l, t, o });
/* Mỗi tab là một "góc nhìn" lên cùng một bản ghi người tham gia -> nhập một lần, các tab tự cập nhật */
const V = {
  p: { c: 'people', f: [f('name', 'Họ tên'), f('phone', 'SĐT', 'tel'), f('src', 'Nguồn', 'sel', 'src'), f('crew', 'Phụ trách'), f('book', 'Ngày hẹn', 'date'), f('slot', 'Giờ hẹn', 'time'), f('scr', 'Sàng lọc', 'calc'), f('shoot', 'Ngày quay', 'date'), f('paid', 'Hỗ trợ', 'sel', 'pd')] },
  v: { c: 'people', need: 'file', f: [f('name', 'Người tham gia'), f('crew', 'Phụ trách quay'), f('shoot', 'Ngày quay', 'date'), f('cam', 'Camera', 'sel', 'cam'), f('file', 'Tên file'), f('gender', 'Giới tính'), f('age', 'Nhóm tuổi'), f('size', 'Dung lượng'), f('dur', 'Thời lượng'), f('qc', 'Kết quả QC', 'sel', 'qc'), f('why', 'Lý do quay lại', 'sel', 'why')] },
  u: { c: 'people', need: 'file', f: [f('name', 'Người tham gia'), f('file', 'Tên file'), f('upd', 'Ngày upload', 'date'), f('up', 'Upload server', 'sel', 'up'), f('qc', 'Xác nhận PRDCV', 'sel', 'qc')] },
  l: { c: 'people', need: 'file', f: [f('name', 'Người tham gia'), f('lab', 'Người gán nhãn'), f('ls', 'Gán nhãn', 'sel', 'ls'), f('ac', 'Nghiệm thu', 'sel', 'ac')] },
  d: { c: 'devices', f: [f('code', 'Mã nội bộ'), f('name', 'Tên thiết bị'), f('st', 'Tình trạng', 'sel', 'dv'), f('note', 'Ghi chú')] },
  r: { c: 'risks', f: [f('title', 'Vấn đề'), f('lv', 'Mức độ', 'sel', 'lv'), f('sol', 'Phương án xử lý'), f('rs', 'Trạng thái', 'sel', 'rs')] }
};
const D = { src: 'Nội bộ', paid: 'Chưa chi', qc: 'Chờ duyệt', up: 'Chưa upload', ls: 'Chưa gán', ac: 'Chờ nghiệm thu', cam: 'L6169', st: 'Chờ kiểm tra', lv: 'Cao', rs: 'Chưa giải quyết' };
const personDefaults = () => ({ startAt: '', payLog: [], videoLog: [], activeVideoId: '', receivedAt: '' });

const seed = () => ({
  people: [],
  devices: [
    ['PHONE_01', 'OPPO Reno10 Pro 5G', ''], ['PHONE_02', 'OPPO A77', 'Cần bật OTG trong Cài đặt'],
    ['CAM_L6169', 'Camera bàn chải (Item Code L6169)', 'Tài sản khách hàng'], ['CAM_L6170', 'Camera bàn chải (Item Code L6170)', 'Tài sản khách hàng'],
    ['ACCESSORY_01', 'Đầu che sáng 1', ''], ['ACCESSORY_02', 'Đầu che sáng 2', ''], ['CABLE_01', 'Dây USB-C to USB-C', 'Mới có 1 dây']
  ].map(([code, name, note], i) => ({ id: 'D' + i, code, name, st: 'Chờ kiểm tra', note })),
  risks: [
    ['Chỉ có 1 dây USB-C to USB-C cho 2 bộ thiết bị', 'Cao', 'Hỏi Panasonic bổ sung dây'],
    ['Chưa có hướng dẫn vệ sinh camera và đầu che sáng', 'Cao', 'Hỏi Panasonic; chưa tự khử khuẩn thiết bị'],
    ['Chưa rõ video lưu ở đâu / server chưa sẵn sàng', 'Cao', 'Giữ video trên điện thoại, không xóa, chờ hướng dẫn']
  ].map(([title, lv, sol], i) => ({ id: 'R' + i, title, lv, sol, rs: 'Chưa giải quyết' })),
  tasks: [],
  activity: [],
  cfg: {
    target: 200, support: 100000, crew: 'Ninh', token: '', chat: '',
    backupEveryPeople: 10, backupEveryHours: 24, payMode: 'sau_xac_nhan', cashOnHand: 0,
    transferOnHand: 0, plannedPeople: 0, lowFundThreshold: 300000, fundsConfigured: false,
    filenameTimeEnabled: false, filenameTimeFormat: 'HHmm', videoInbox: [], dayClosures: {}
  },
  backup: 0,
  backupPeopleCount: 0,
  peopleAddedSinceBackup: 0,
  deleted: [],
  syncMeta: { serverUpdatedAt: null, lastSyncedAt: '', pendingChanges: 0, initialReviewed: false },
  schemaVersion: SCHEMA_VERSION,
  savedAt: '',
  undoStack: []
});

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
let S = load();
let AUTH = loadAuth();
if (AUTH) AUTH.session = false;
let migratedOnLoad = false;
if (!S) { S = seed(); migratedOnLoad = migrate(true); save(); }
else { migratedOnLoad = migrate(false); if (migratedOnLoad) save(); }
let tab = 0;
let collectionDay = today();
let pendingImport = null;
let pendingVideoMetadata = Promise.resolve();

function save() {
  const previous = S.savedAt;
  S.savedAt = new Date().toISOString();
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    updateSaveStatus();
    return true;
  } catch (e) {
    S.savedAt = previous;
    alert('Không lưu được dữ liệu trên trình duyệt này. Hãy xuất sao lưu ngay.');
    return false;
  }
}
function loadAuth() {
  try {
    const auth = JSON.parse(localStorage.getItem(AUTH_KEY));
    return auth && auth.version === 1 && auth.email && auth.salt && auth.hash ? auth : null;
  } catch (e) {
    alert('Không đọc được thông tin đăng nhập cục bộ. Hãy kiểm tra dữ liệu trình duyệt.');
    return null;
  }
}
function logActivity(action, detail, entity = '') {
  if (!Array.isArray(S.activity)) S.activity = [];
  S.activity.unshift({ id: uid(), at: new Date().toISOString(), date: today(), action, detail: String(detail || ''), entity });
  if (S.activity.length > 5000) S.activity.length = 5000;
}
function updateSaveStatus() {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  const saved = S.savedAt ? new Date(S.savedAt) : null;
  el.textContent = saved && !Number.isNaN(saved.getTime())
    ? `Đã lưu lúc ${saved.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}`
    : 'Chưa lưu';
}
function showSaveDetails() {
  showM(mhead('Lưu trữ trên thiết bị') + '<p>Dữ liệu chỉ được lưu trong trình duyệt này, trên khóa prdcv2. Không có đồng bộ máy chủ.</p>');
}

function ensureLocalRecordMetadata() {
  let changed = false;
  const fallback = S.savedAt && Number.isFinite(Date.parse(S.savedAt)) ? S.savedAt : new Date().toISOString();
  ['people', 'devices', 'risks', 'tasks', 'activity'].forEach(collection => {
    S[collection].forEach((record, index) => {
      if (!record || typeof record !== 'object' || Array.isArray(record)) return;
      if (!record.id) {
        record.id = `legacy-${collection}-${index}-${Date.now()}`;
        changed = true;
      }
      if (!record.updatedAt || !Number.isFinite(Date.parse(record.updatedAt))) {
        record.updatedAt = fallback;
        changed = true;
      }
      ['payLog', 'videoLog'].forEach(key => {
        if (!Array.isArray(record[key])) return;
        record[key].forEach((item, nestedIndex) => {
          if (!item || typeof item !== 'object' || Array.isArray(item)) return;
          if (!item.id) {
            item.id = `legacy-${collection}-${index}-${key}-${nestedIndex}-${Date.now()}`;
            changed = true;
          }
          if (!item.updatedAt || !Number.isFinite(Date.parse(item.updatedAt))) {
            item.updatedAt = fallback;
            changed = true;
          }
        });
      });
    });
  });
  if (Array.isArray(S.cfg.videoInbox)) {
    S.cfg.videoInbox.forEach((item, index) => {
      if (!item || typeof item !== 'object' || Array.isArray(item)) return;
      if (!item.id) {
        item.id = `legacy-video-${index}-${Date.now()}`;
        changed = true;
      }
      if (!item.updatedAt || !Number.isFinite(Date.parse(item.updatedAt))) {
        item.updatedAt = fallback;
        changed = true;
      }
    });
  }
  if (!S.cfg.updatedAt || !Number.isFinite(Date.parse(S.cfg.updatedAt))) {
    S.cfg.updatedAt = fallback;
    changed = true;
  }
  return changed;
}

/* Chuyển dữ liệu từ bản cũ (nếu có) sang cấu trúc mới */
function migrate(importLegacy) {
  let changed = false;
  const defaults = seed();
  ['people', 'devices', 'risks', 'tasks', 'activity'].forEach(key => {
    if (!Array.isArray(S[key])) { S[key] = defaults[key]; changed = true; }
  });
  if (!S.cfg || typeof S.cfg !== 'object' || Array.isArray(S.cfg)) { S.cfg = defaults.cfg; changed = true; }
  S.cfg = { open: '10:00', close: '17:00', step: 15, ...S.cfg };
  Object.keys(defaults.cfg).forEach(key => {
    if (!(key in S.cfg)) { S.cfg[key] = defaults.cfg[key]; changed = true; }
  });
  if (!['sau_xac_nhan', 'tam_ung'].includes(S.cfg.payMode)) { S.cfg.payMode = 'sau_xac_nhan'; changed = true; }
  if (!Array.isArray(S.cfg.videoInbox)) { S.cfg.videoInbox = []; changed = true; }
  if (!S.cfg.dayClosures || typeof S.cfg.dayClosures !== 'object' || Array.isArray(S.cfg.dayClosures)) { S.cfg.dayClosures = {}; changed = true; }
  if (!Number.isFinite(S.backup)) { S.backup = 0; changed = true; }
  if (!Number.isFinite(S.backupPeopleCount)) { S.backupPeopleCount = 0; changed = true; }
  if (!Number.isFinite(S.peopleAddedSinceBackup)) {
    S.peopleAddedSinceBackup = S.backup ? Math.max(0, S.people.length - S.backupPeopleCount) : S.people.length;
    changed = true;
  }
  if (!Array.isArray(S.undoStack)) { S.undoStack = []; changed = true; }
  if (!Number.isFinite(S.schemaVersion) || S.schemaVersion < SCHEMA_VERSION) {
    S.schemaVersion = SCHEMA_VERSION;
    changed = true;
  }
  if (!Object.prototype.hasOwnProperty.call(S, 'savedAt')) { S.savedAt = ''; changed = true; }
  changed = ensureLocalRecordMetadata() || changed;

  const old = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const iso = d => { const m = String(d || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : ''; };
  const find = n => S.people.find(p => p.name.toLowerCase() === String(n).trim().toLowerCase());
  if (importLegacy) {
    (old('prdcv_participants') || []).forEach(p => { if (p.name) S.people.push({ ...D, id: nextId(), name: p.name, src: p.source || D.src, crew: p.crew || '', book: iso(p.dateCheck || p.date), paid: p.paid === 'Đã chi' ? 'Đã chi' : 'Chưa chi' }); });
    (old('prdcv_videos') || []).forEach(v => {
      let p = find(v.participant);
      if (!p) { p = { ...D, id: nextId(), name: v.participant, src: D.src }; S.people.push(p); }
      Object.assign(p, { crew: v.crew || p.crew, shoot: iso(v.date), cam: v.camera || D.cam, file: v.filename, size: v.size, dur: v.duration, qc: /đạt/i.test(v.qc) ? 'Đạt chuẩn' : /quay/i.test(v.qc) ? 'Cần quay lại' : 'Chờ duyệt' });
    });
  }
  S.people.forEach(person => {
    if (!Object.prototype.hasOwnProperty.call(person, 'updatedAt')) { person.updatedAt = ''; changed = true; }
    if (!Object.prototype.hasOwnProperty.call(person, 'startAt')) { person.startAt = ''; changed = true; }
    if (!Array.isArray(person.payLog)) { person.payLog = []; changed = true; }
    if (!Object.prototype.hasOwnProperty.call(person, 'receivedAt')) { person.receivedAt = ''; changed = true; }
    if (!Array.isArray(person.videoLog)) {
      person.videoLog = person.file ? [{
        id: `legacy-${person.id}`, file: person.file, size: person.size || '', dur: person.dur || '',
        gender: person.gender || '', age: person.age || '', cam: person.cam || D.cam,
        qc: person.qc || D.qc, up: person.up || D.up, why: person.why || '', shoot: person.shoot || '',
        startAt: person.startAt || '', addedAt: person.updatedAt || ''
      }] : [];
      changed = true;
    }
    if (!Object.prototype.hasOwnProperty.call(person, 'activeVideoId')) {
      person.activeVideoId = person.videoLog.length ? person.videoLog[person.videoLog.length - 1].id : '';
      changed = true;
    }
  });
  S.devices.forEach(device => {
    if (!Object.prototype.hasOwnProperty.call(device, 'updatedAt')) { device.updatedAt = ''; changed = true; }
  });
  S.risks.forEach(risk => {
    if (!Object.prototype.hasOwnProperty.call(risk, 'updatedAt')) { risk.updatedAt = ''; changed = true; }
  });
  S.tasks.forEach(task => {
    if (!Object.prototype.hasOwnProperty.call(task, 'updatedAt')) { task.updatedAt = ''; changed = true; }
  });
  return changed;
}

/* ============ TIỆN ÍCH ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fd = d => d ? d.split('-').reverse().join('/') : '';
const money = n => n.toLocaleString('vi-VN') + ' đ';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const localDateTimeValue = value => {
  const date = value ? new Date(value) : null;
  if (!date || Number.isNaN(date.getTime())) return '';
  const pad = number => String(number).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
};
const localIsoDate = value => {
  const date = value instanceof Date ? value : new Date(value);
  return Number.isNaN(date.getTime()) ? '' : `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
};
if (migratedOnLoad) {
  logActivity('Nâng cấp dữ liệu', `Bổ sung cấu trúc dữ liệu phiên bản ${SCHEMA_VERSION}; giữ nguyên các trường hiện có`);
  save();
}
function nextId() { const n = Math.max(0, ...S.people.map(p => parseInt(String(p.id).replace(/\D/g, '')) || 0)); return 'P-' + String(n + 1).padStart(3, '0'); }
const chipCls = v => /Đạt chuẩn|Đã upload|Đã xong|Đã nghiệm thu|Đã chi|Hoạt động tốt|Đã giải quyết|Thấp|Đủ ĐK/.test(v) ? 'bg-emerald-100 text-emerald-800'
  : /Cần (quay|sửa)|Có lỗi|Cao|Nghi/.test(v) ? 'bg-rose-100 text-rose-800' : /Chờ|Chưa|Đang|Trung bình|Cần hỏi/.test(v) ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700';

function videoRecords(person) {
  if (Array.isArray(person.videoLog) && person.videoLog.length) return person.videoLog;
  return person.file ? [{ ...person, id: person.id, shoot: person.shoot || '' }] : [];
}
function hasPayment(person) {
  return person.paid === 'Đã chi' || (Array.isArray(person.payLog) && person.payLog.length > 0);
}
function isPendingTransfer(entry) {
  return entry.method === 'transfer' && entry.status === 'pending_transfer';
}
function hasCompletedPayment(person) {
  return person.paid === 'Đã chi' ||
    (Array.isArray(person.payLog) && person.payLog.some(entry => !isPendingTransfer(entry)));
}
function hasPendingTransfer(person) {
  return Array.isArray(person.payLog) && person.payLog.some(isPendingTransfer);
}
function paymentTotal(person) {
  return (Array.isArray(person.payLog) ? person.payLog : []).reduce((sum, entry) => sum + (Number(entry.amount) || 0), 0);
}
function allVideoRecords() {
  return S.people.flatMap(person => videoRecords(person).map(video => ({ person, video })));
}
function dayVideoCount(day) {
  return allVideoRecords().filter(({ video }) => video.shoot === day).length;
}
function isDayLocked(day) {
  return !!(day && S.cfg.dayClosures && S.cfg.dayClosures[day] && S.cfg.dayClosures[day].locked);
}
function lockedDayForRecord(record, collection) {
  const days = collection === 'people'
    ? [record.book, record.shoot, ...(Array.isArray(record.videoLog) ? record.videoLog.map(video => video.shoot) : [])]
    : collection === 'tasks' ? [record.createdDate] : [];
  return days.find(isDayLocked) || '';
}
function rejectLockedDay(day) {
  if (!day || !isDayLocked(day)) return false;
  alert(`Ngày ${fd(day)} đang khóa. Hãy mở khóa ngày đó có xác nhận trước khi sửa.`);
  return true;
}
function syncActiveVideo(person) {
  if (!person.file) return;
  if (!Array.isArray(person.videoLog)) person.videoLog = [];
  let video = person.videoLog.find(item => item.id === person.activeVideoId) || person.videoLog[person.videoLog.length - 1];
  if (!video) {
    video = { id: uid() };
    person.videoLog.push(video);
    person.activeVideoId = video.id;
  }
  Object.assign(video, {
    file: person.file, size: person.size || '', dur: person.dur || '', gender: person.gender || '',
    age: person.age || '', cam: person.cam || D.cam, qc: person.qc || D.qc, up: person.up || D.up,
    why: person.why || '', shoot: person.shoot || '', startAt: person.startAt || ''
  });
}

/* ============ TỰ ĐỘNG TÍNH & CẢNH BÁO ============ */
function stats() {
  const P = S.people, c = S.cfg, t = today();
  const videos = allVideoRecords();
  const shot = videos.length, ok = videos.filter(({ video }) => video.qc === 'Đạt chuẩn').length;
  const redo = videos.filter(({ video }) => video.qc === 'Cần quay lại').length;
  const wait = videos.filter(({ video }) => video.qc === 'Chờ duyệt').length;
  const toUp = videos.filter(({ video }) => video.qc === 'Đạt chuẩn' && video.up !== 'Đã upload').length;
  const toPay = P.filter(p => p.file && p.qc === 'Đạt chuẩn' && !hasPayment(p));
  const payBad = P.filter(p => hasCompletedPayment(p) && p.qc !== 'Đạt chuẩn').length;
  const rate = ok + redo ? ok / (ok + redo) : null;
  const miss = Math.max(0, c.target - ok);
  return {
    reg: P.length, shot, ok, redo, wait, toUp, toPay: toPay.length,
    payBad, rate, miss, extra: rate ? Math.ceil(miss / rate) : null, pct: c.target ? Math.min(100, ok / c.target * 100) : 0,
    cash: toPay.length * c.support, paidN: P.filter(hasCompletedPayment).length,
    pendingTransferN: pendingTransfers().length,
    todayShot: dayVideoCount(t), todayLeft: P.filter(p => p.book === t && !p.shoot).length,
    labDone: P.filter(p => p.ls === 'Đã xong').length, labNow: P.filter(p => p.ls === 'Đang gán').length
  };
}
function qualityIssues() {
  const issues = [], people = S.people;
  const add = (person, text, targetTab = 1) => issues.push({ id: person.id, text, tab: targetTab });
  const grouped = (keyFn, label) => {
    const groups = new Map();
    people.forEach(person => {
      const key = keyFn(person);
      if (!key) return;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(person);
    });
    groups.forEach(group => {
      if (group.length > 1) group.forEach(person => add(person, `${label}: ${person.name || person.id}`));
    });
  };
  grouped(person => String(person.phone || '').replace(/\D/g, ''), 'Trùng số điện thoại');
  grouped(person => String(person.name || '').trim().toLocaleLowerCase('vi'), 'Trùng tên');

  const files = new Map();
  const videoPeople = new Map();
  const videos = allVideoRecords();
  videos.forEach(({ person, video }) => {
    if (!video.file) return;
    if (!person.name || !person.id) add(person, 'Video chưa gắn với bản ghi người tham gia', 2);
    if (!(video.gender || person.gender) || !(video.age || person.age)) add(person, `Video thiếu giới tính hoặc nhóm tuổi: ${video.file}`, 2);
    const fileKey = String(video.file).trim().toLocaleLowerCase('vi');
    if (!files.has(fileKey)) files.set(fileKey, []);
    files.get(fileKey).push({ person, video });
    if (!videoPeople.has(person.id)) videoPeople.set(person.id, []);
    videoPeople.get(person.id).push({ person, video });
  });
  S.cfg.videoInbox.forEach(video => issues.push({ id: video.id, text: `Video chưa ghép với người tham gia: ${video.file}`, tab: 2 }));
  files.forEach(group => {
    if (group.length > 1) group.forEach(({ person, video }) => add(person, `Trùng tên file video: ${video.file}`, 2));
  });
  videoPeople.forEach(group => {
    if (group.length > 1) {
      group.forEach(({ person }) => add(person, 'Người tham gia có nhiều video gắn cùng mã, cần kiểm tra', 2));
    }
  });
  people.forEach(person => {
    if (hasCompletedPayment(person) && person.qc !== 'Đạt chuẩn') {
      add(person, 'Đã chi tiền nhưng video chưa được xác nhận đạt chuẩn', 2);
    }
  });

  const findOutliers = (field, parse, label) => {
    const values = videos.filter(({ video }) => video.file).map(item => ({ ...item, value: parse(item.video[field]) })).filter(item => Number.isFinite(item.value));
    if (values.length < 3) return;
    const average = values.reduce((sum, item) => sum + item.value, 0) / values.length;
    const deviation = Math.sqrt(values.reduce((sum, item) => sum + Math.pow(item.value - average, 2), 0) / values.length);
    if (!deviation) return;
    values.filter(item => Math.abs(item.value - average) > 2 * deviation)
      .forEach(item => add(item.person, `${label} của ${item.video.file} lệch bất thường so với trung bình, cần xem lại`, 2));
  };
  findOutliers('size', value => {
    const match = String(value || '').match(/[\d.]+/);
    return match ? Number(match[0]) : NaN;
  }, 'Dung lượng');
  findOutliers('dur', value => {
    const match = String(value || '').match(/^(\d+):(\d{1,2})$/);
    return match ? Number(match[1]) * 60 + Number(match[2]) : NaN;
  }, 'Thời lượng');
  return issues;
}

  }
  if (s.pendingTransferN) add('a', `${s.pendingTransferN} khoản hỗ trợ đang Chờ chuyển (${money(pendingTransferAmount())})`, 5);
  const plannedPeople = Math.max(0, Number(S.cfg.plannedPeople) || 0);
  const plannedAmount = plannedPeople * (Number(S.cfg.support) || 0);
  if (plannedPeople && plannedAmount > cashAvailable() + transferAvailable()) {

  }
  if (s.payBad) add('r', `${s.payBad} người đã chi hỗ trợ nhưng video chưa được xác nhận đạt`, 0);
  if (s.todayLeft) add('a', `Hôm nay hẹn ${s.todayLeft} người, chưa có ngày quay`, 1);
  if (s.wait) add('a', `${s.wait} video đang chờ anh Phong xác nhận`, 2);
  if (s.redo) add('r', `${s.redo} video cần quay lại`, 2);
  if (s.toUp) add('a', `${s.toUp} video đạt chưa upload lên server`, 3);
  if (s.toPay) add('a', `${s.toPay} người đủ điều kiện nhận hỗ trợ, chưa chi (${money(s.cash)})`, 1);
  const sn = S.people.filter(p => !p.shoot && scr(p) === 'Nghi không đủ').length; if (sn) add('r', `${sn} người nghi không đủ điều kiện, chưa quay: hỏi người phụ trách trước`, 1);
  const sh = S.people.filter(p => !p.shoot && scr(p) === 'Cần hỏi thêm').length; if (sh) add('a', `${sh} người chưa rõ điều kiện, cần hỏi thêm`, 1);
  const dv = S.devices.filter(d => d.st === 'Chờ kiểm tra').length; if (dv) add('a', `${dv} thiết bị chờ kiểm tra thực tế`, 4);
  const rk = S.risks.filter(r => r.rs !== 'Đã giải quyết').length; if (rk) add('a', `${rk} vấn đề/rủi ro chưa giải quyết`, 4);
  const days = S.backup ? Math.floor((Date.now() - S.backup) / 864e5) : null;
  const peopleSinceBackup = Math.max(0, S.peopleAddedSinceBackup || 0);
  const peopleLimit = Math.max(1, Number(S.cfg.backupEveryPeople) || 10);
  const hoursLimit = Math.max(1, Number(S.cfg.backupEveryHours) || 24);
  const hoursSinceBackup = S.backup ? (Date.now() - S.backup) / 36e5 : null;
  if (S.people.length && (days === null || peopleSinceBackup >= peopleLimit || hoursSinceBackup >= hoursLimit)) {
    const reason = days === null ? 'Chưa sao lưu dữ liệu lần nào'
      : peopleSinceBackup >= peopleLimit ? `Đã thêm ${peopleSinceBackup} người từ lần sao lưu gần nhất`
        : `Đã quá ${hoursLimit} giờ từ lần sao lưu gần nhất`;
    add('a', `${reason} (dữ liệu chỉ nằm trong trình duyệt này)`, 'bk');
  }
  const issueCount = qualityIssues().length;
  if (issueCount) add('a', `${issueCount} mục cần xem lại trong danh sách “Cần sửa”`, 'issues');
  return a;
}
function allPayments() {
  return S.people.flatMap(person => (Array.isArray(person.payLog) ? person.payLog : [])
    .map(entry => ({ person, entry })));
}
function pendingTransfers() {
  return allPayments().filter(({ entry }) => isPendingTransfer(entry));
}
function pendingTransferAmount() {
  return pendingTransfers().reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
}
function cashSpent() {
  return allPayments().reduce((sum, item) => sum + (item.entry.method === 'cash' ? Number(item.entry.amount) || 0 : 0), 0);
}
function transferSpent() {
  return allPayments().reduce((sum, item) => sum + (item.entry.method === 'transfer' && !isPendingTransfer(item.entry) ? Number(item.entry.amount) || 0 : 0), 0);
}
function cashRemaining() { return (Number(S.cfg.cashOnHand) || 0) - cashSpent(); }
function transferRemaining() { return (Number(S.cfg.transferOnHand) || 0) - transferSpent(); }
function cashAvailable() { return cashRemaining(); }
function transferAvailable() { return transferRemaining() - pendingTransferAmount(); }
function peopleAffordable(amount) {
  const support = Number(S.cfg.support) || 0;
  return support > 0 ? Math.floor(Math.max(0, amount) / support) : 0;
}
function paymentDate(entry) {
  return entry.method === 'transfer' && !isPendingTransfer(entry) && entry.sentAt ? entry.sentAt : entry.at;
}
function dailyPayments(day) {
  return allPayments().filter(({ entry }) => localIsoDate(paymentDate(entry)) === day);
}
function dailySummary(day, phoneFileCount) {
  const videos = allVideoRecords().filter(({ video }) => video.shoot === day);
  const unmatched = S.cfg.videoInbox.filter(video => localIsoDate(video.importedAt || video.fileDate) === day).length;
  const payments = dailyPayments(day);
  const paidAmount = payments.filter(({ entry }) => !isPendingTransfer(entry))
    .reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
  const cashPaid = payments.filter(({ entry }) => entry.method === 'cash')
    .reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
  const transferPaid = payments.filter(({ entry }) => entry.method === 'transfer' && !isPendingTransfer(entry))
    .reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
  const pendingToday = payments.filter(({ entry }) => isPendingTransfer(entry))
    .reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
  const paidPeople = new Set(payments.filter(({ entry }) => !isPendingTransfer(entry)).map(item => item.person.id)).size;
  const pendingPeople = new Set(payments.filter(({ entry }) => isPendingTransfer(entry)).map(item => item.person.id)).size;
  const people = S.people.filter(person => person.book === day || person.shoot === day).length;
  const difference = phoneFileCount == null ? null : Number(phoneFileCount) - videos.length;
  return {
    day, people, videoCount: videos.length, unmatched, phoneFileCount, difference,
    paidAmount, cashPaid, transferPaid, pendingToday, paidPeople, pendingPeople,
    cashRemaining: cashRemaining(), transferRemaining: transferRemaining(),
    pendingTransferAmount: pendingTransferAmount(), outstandingTasks: S.tasks.filter(task => !task.done).length
  };
}
function report(day = today()) {
  const s = stats(), pc = s.rate == null ? 'chưa có' : Math.round(s.rate * 100) + '%';
  const al = alerts().filter(x => x.to !== 'bk').map(x => '- ' + x.txt);
  const ev = (S.activity || []).filter(x => x.date === day);
  const dayVideos = dayVideoCount(day);
  const dayTasks = S.tasks.filter(t => t.createdDate === day);
  const dayEntries = dailyPayments(day);
  const dayPayments = dayEntries.filter(({ entry }) => !isPendingTransfer(entry))
    .reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
  const dayCash = dayEntries.filter(({ entry }) => entry.method === 'cash')
    .reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
  const dayTransfer = dayEntries.filter(({ entry }) => entry.method === 'transfer' && !isPendingTransfer(entry))
    .reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
  const dayPending = dayEntries.filter(({ entry }) => isPendingTransfer(entry))
    .reduce((sum, item) => sum + (Number(item.entry.amount) || 0), 0);
  const closure = S.cfg.dayClosures[day];
  return [`BÁO CÁO PRDCV - ${fd(day)}`, `Video ghi nhận trong ngày: ${dayVideos}`,
    `Tổng lũy kế hiện tại: đăng ký ${s.reg} | đã quay ${s.shot} | chờ duyệt ${s.wait} | đạt ${s.ok} | cần quay lại ${s.redo}`,
    `Lưu ý: số liệu tổng lũy kế phản ánh trạng thái hiện tại; phần nhật ký bên dưới phản ánh thao tác đúng ngày được chọn.`,
    `Tiến độ: ${s.ok}/${S.cfg.target} video đạt (${s.pct.toFixed(1)}%), tỷ lệ đạt ${pc}` + (s.extra ? `, còn thiếu ${s.miss}, cần quay thêm khoảng ${s.extra} lượt` : `, còn thiếu ${s.miss}`),
    `Upload: ${s.toUp} video đạt chưa upload | Hỗ trợ: đã chi ${s.paidN}, chưa chi ${s.toPay} (${money(s.cash)})`,
    `Chi trong ngày (${new Set(dayEntries.filter(({ entry }) => !isPendingTransfer(entry)).map(item => item.person.id)).size} người): tiền mặt ${money(dayCash)} | chuyển khoản ${money(dayTransfer)} | tổng ${money(dayPayments)}`,
    `Chờ chuyển: ${new Set(dayEntries.filter(({ entry }) => isPendingTransfer(entry)).map(item => item.person.id)).size} người · ${money(dayPending)} trong ngày; tổng còn chờ ${money(pendingTransferAmount())}`,
    `Số dư quỹ hiện tại: tiền mặt ${money(cashRemaining())} (đủ ${peopleAffordable(cashAvailable())} người) | chuyển khoản ${money(transferRemaining())} (đủ thêm ${peopleAffordable(transferAvailable())} người)`,
    `Gán nhãn: xong ${s.labDone}, đang gán ${s.labNow}`,
    `Hoạt động ghi nhận trong ngày: ${ev.length}`, 'Báo cáo không chứa tên, số điện thoại hoặc nội dung nhật ký có thể nhận diện người tham gia.',
    `Công việc tạo trong ngày: ${dayTasks.length}`,
    closure ? `ĐÓNG NGÀY: đếm trên OPPO ${closure.phoneFileCount}; web ${closure.videoCount}; lệch ${closure.difference}; chưa ghép ${closure.unmatched}; người ${closure.people}; việc tồn ${closure.outstandingTasks}.` : '',
    al.length ? 'Cần chú ý:\n' + al.join('\n') : 'Không có việc tồn đọng.'].join('\n');
}

function confirmPayment(id) {
  const person = S.people.find(item => item.id === id);
  if (!person || hasPayment(person)) { alert('Không tìm thấy người hoặc khoản này đã được chi.'); return; }
  if (rejectLockedDay(today())) return;
  const locked = lockedDayForRecord(person, 'people');
  if (locked) { rejectLockedDay(locked); return; }
  const amount = Number($('#payAmount').value), method = $('#payMethod').value;
  const reason = $('#payReason')?.value.trim() || '';
  const note = $('#payNote').value.trim(), paidBy = $('#payBy').value.trim();
  const accepted = !!person.file && person.qc === 'Đạt chuẩn';
  const early = !accepted;
  if (!Number.isFinite(amount) || amount <= 0) { alert('Số tiền phải lớn hơn 0.'); return; }
  if (method !== 'cash' && method !== 'transfer') { alert('Hãy chọn hình thức chi hợp lệ.'); return; }
  if (!paidBy) { alert('Hãy nhập người chi.'); return; }
  if (early && S.cfg.payMode !== 'tam_ung') { alert('Chỉ được chi sau khi video được Panasonic xác nhận đạt chuẩn.'); return; }
  if (early && !reason) { alert('Chi tạm ứng bắt buộc phải có lý do.'); return; }
  if ([note, reason, paidBy].some(value => /\d(?:[ -]?\d){7,}/.test(value))) {
    alert('Không nhập số tài khoản ngân hàng hoặc chuỗi từ 8 chữ số vào lý do, người chi hay ghi chú.');
    return;
  }
  if (method === 'cash' && amount > cashAvailable()) { alert(`Quỹ tiền mặt không đủ. Còn khả dụng ${money(cashAvailable())}.`); return; }
  const pending = method === 'transfer';
  if (!confirm(`${pending ? 'Ghi nhận khoản chuyển khoản đang Chờ chuyển' : 'Xác nhận chi tiền mặt'} ${money(amount)} cho ${person.id} - ${person.name}?`)) return;
  recordUndo('people', person, `Chi hỗ trợ cho ${person.name}`);
  const entry = { id: uid(), at: new Date().toISOString(), amount, method, status: pending ? 'pending_transfer' : 'paid', paidBy, note, early, reason };
  person.payLog = Array.isArray(person.payLog) ? person.payLog : [];
  person.payLog.push(entry);
  person.paid = pending ? 'Chờ chuyển' : 'Đã chi';
  person.updatedAt = new Date().toISOString();
  logActivity(pending ? 'Ghi nhận hỗ trợ chờ chuyển khoản' : (early ? 'Chi tạm ứng trước xác nhận QC' : 'Chi hỗ trợ sau xác nhận QC'), `${person.id} - ${person.name}: ${money(amount)}, ${method === 'cash' ? 'tiền mặt' : 'chuyển khoản'}${early ? `; lý do: ${reason}` : ''}`);
  save(); closeM(); render();
}

function toggleFrom(input) { tog(input.dataset.id); }
function cloneRecord(record) { return record ? JSON.parse(JSON.stringify(record)) : null; }
function recordUndo(collection, record, action, before = record) {
  S.undoStack.push({ collection, id: record.id, before: cloneRecord(before), action, at: new Date().toISOString() });
  if (S.undoStack.length > 20) S.undoStack.shift();
}
function undoPanel() {
  const last = S.undoStack[S.undoStack.length - 1];
  return `<div class="sticky top-16 z-30 bg-amber-50 border border-amber-300 rounded-xl p-3 flex items-center justify-between gap-3 shadow-sm"><span class="text-xs text-amber-900">Vừa thao tác: ${esc(last.action)}</span><button onclick="undoLast()" class="shrink-0 bg-amber-600 text-white font-bold rounded-lg px-4 py-2">Hoàn tác</button></div>`;
}
function undoLast() {
  const item = S.undoStack[S.undoStack.length - 1];
  if (!item) return;
  const list = S[item.collection];
  const existing = list && list.find(record => record.id === item.id);
  if (rejectLockedDay(lockedDayForRecord(existing || item.before || {}, item.collection))) return;
  S.undoStack.pop();
  const index = list.findIndex(record => record.id === item.id);
  if (item.before) {
    if (index >= 0) list[index] = item.before;
    else list.push(item.before);
  } else if (index >= 0) {
    list.splice(index, 1);
  }
  if (item.also && item.also.key === 'videoInbox') S.cfg.videoInbox = item.also.before;
  logActivity('Hoàn tác thao tác', item.action);
  save(); render();
}

/* ============ THAO TÁC ============ */
function del(c, id) {
  const old = S[c].find(r => r.id === id);
  if (!old || rejectLockedDay(lockedDayForRecord(old, c))) return;
  if (!confirm('Xóa dòng này?')) return;
  if (old) recordUndo(c, old, `Xóa ${old.name || old.title || old.code || old.t || id}`);
  logActivity('Xóa dữ liệu', `${c}: ${old?.name || old?.title || old?.code || old?.t || id}`);
  S[c] = S[c].filter(r => r.id !== id); save(); render();
}
function cyc(c, id, k, o) {
  const r = S[c].find(x => x.id === id);
  if (!r) return;
  if (k === 'paid') { openPayment(id); return; }
  if (rejectLockedDay(lockedDayForRecord(r, c))) return;
  const op = O[o], nx = op[(op.indexOf(r[k]) + 1) % op.length];

function passwordBytes(password, salt) {
  if (!window.crypto || !crypto.subtle) throw new Error('Trình duyệt không hỗ trợ mã hóa mật khẩu an toàn. Hãy mở trang qua HTTPS hoặc localhost.');
  const saltBytes = salt ? Uint8Array.from(atob(salt), c => c.charCodeAt(0)) : crypto.getRandomValues(new Uint8Array(16));
  return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits'])
    .then(key => crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBytes, iterations: 210000, hash: 'SHA-256' }, key, 256))
    .then(bits => ({ salt: btoa(String.fromCharCode(...saltBytes)), hash: btoa(String.fromCharCode(...new Uint8Array(bits))) }));
}
async function registerLocalAccount() {
  const email = $('#authEmail').value.trim().toLowerCase(), password = $('#authPassword').value, confirmPassword = $('#authConfirm').value;
  if (!$('#authEmail').checkValidity() || !email) { alert('Hãy nhập email hợp lệ.'); return; }
  if (password.length < 8) { alert('Mật khẩu cần có ít nhất 8 ký tự.'); return; }
  if (password !== confirmPassword) { alert('Mật khẩu nhập lại không khớp.'); return; }
  if (AUTH) { alert('Thiết bị này đã có tài khoản.'); return; }
  try {
    const credential = await passwordBytes(password);
    const auth = { version: 1, email, ...credential, session: true };
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    AUTH = auth; render();
  } catch (e) { alert(e.message || 'Không thể tạo tài khoản trên thiết bị này.'); }
}
async function loginLocalAccount() {

  if (email !== AUTH.email.toLowerCase() || !password) { alert('Email hoặc mật khẩu không đúng.'); return; }
  try {
    const result = await passwordBytes(password, AUTH.salt);
    if (result.hash !== AUTH.hash) { alert('Email hoặc mật khẩu không đúng.'); return; }
    const auth = { ...AUTH, session: true };
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));

}

    peopleAddedSinceBackup: 0,
    savedAt,
    activity: [activityEntry, ...S.activity].slice(0, 5000)
  };
  return {
    blob: new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' }),
    timestamp,
    peopleCount: S.people.length,
    activityEntry
  };
}
function commitBackup(backup) {
  S.backup = backup.timestamp;
  S.backupPeopleCount = backup.peopleCount;
  S.peopleAddedSinceBackup = 0;
  S.activity.unshift(backup.activityEntry);
  if (S.activity.length > 5000) S.activity.length = 5000;
  save();
}
function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = fileName; link.style.display = 'none';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function exportData() {
  const backup = prepareBackup(), fileName = `prdcv-sao-luu-${today()}.json`;
  if (typeof File !== 'undefined' && navigator.share && navigator.canShare) {
    const file = new File([backup.blob], fileName, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Sao lưu PRDCV' });
        commitBackup(backup);
        render();
        return;
      } catch (error) {
        if (error.name === 'AbortError') { render(); return; }
        console.error('Không thể chia sẻ bản sao lưu:', error);
      }
    }
  }
  downloadBlob(backup.blob, fileName);
  commitBackup(backup);
  render();
}
function importMatchIndex(list, record, collection) {
  const byId = record.id ? list.findIndex(existing => existing.id === record.id) : -1;
  if (byId >= 0) return byId;
  const phone = collection === 'people' ? String(record.phone || '').replace(/\D/g, '') : '';
  return phone ? list.findIndex(existing => String(existing.phone || '').replace(/\D/g, '') === phone) : -1;
}
function mergeArray(current, incoming, collection) {
  const result = current.map(cloneRecord), counts = { added: 0, updated: 0, kept: 0 };
  (Array.isArray(incoming) ? incoming : []).forEach(record => {
    const index = importMatchIndex(result, record, collection);
    if (index < 0) {
      result.push(cloneRecord(record)); counts.added++;
      return;
    }
    const existing = result[index];
    const oldTime = Date.parse(existing.updatedAt || existing.at || '') || 0;
    const newTime = Date.parse(record.updatedAt || record.at || '') || 0;
    if (newTime > oldTime) {
      result[index] = { ...existing, ...cloneRecord(record) };
      counts.updated++;
    } else {
      counts.kept++;
    }
  });
  return { records: result, counts };
}
function makeMergePlan(data) {
  const groups = {};
  ['people', 'devices', 'risks', 'tasks', 'activity'].forEach(key => {
    groups[key] = mergeArray(S[key], data[key], key);
  });
  const incomingConfigTime = Date.parse(data.cfg && data.cfg.updatedAt || '') || 0;
  const localConfigTime = Date.parse(S.cfg.updatedAt || '') || 0;
  return { groups, useIncomingConfig: incomingConfigTime > localConfigTime };
}
function importSummary(mode, plan, data) {
  if (mode === 'replace') {
    return `Chế độ THAY THẾ sẽ thay dữ liệu hiện tại bằng file sao lưu.\nFile có ${data.people.length} người, ${(data.devices || []).length} thiết bị, ${(data.risks || []).length} vấn đề và ${(data.tasks || []).length} công việc.\n\nỨng dụng sẽ tải một bản sao lưu dữ liệu hiện tại trước khi thay thế. Tiếp tục?`;
  }
  const labels = { people: 'Người', devices: 'Thiết bị', risks: 'Vấn đề', tasks: 'Công việc', activity: 'Nhật ký' };
  const lines = Object.entries(plan.groups).map(([key, group]) =>
    `${labels[key]}: thêm ${group.counts.added}, cập nhật bản mới hơn ${group.counts.updated}, giữ dữ liệu hiện tại ${group.counts.kept}`
  );
  lines.push(`Cài đặt: ${plan.useIncomingConfig ? 'dùng bản có thời điểm cập nhật mới hơn' : 'giữ cài đặt hiện tại (không có thời điểm cập nhật mới hơn)'}`);
  return `Chế độ GỘP. Bản tóm tắt:\n${lines.join('\n')}\n\nBản ghi cũ không có thời điểm cập nhật sẽ không ghi đè bản ghi hiện tại. Ứng dụng sẽ tải bản sao lưu trước khi gộp. Tiếp tục?`;
}
function importData(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(rd.result); }
    catch (error) { alert('Không đọc được JSON trong file sao lưu.'); return; }
    if (!data || typeof data !== 'object' || Array.isArray(data) || !Array.isArray(data.people)) {
      alert('File không đúng định dạng sao lưu của hệ thống.');
      return;
    }
    pendingImport = data;
    const groups = ['people', 'devices', 'risks', 'tasks', 'activity'];
    if (groups.some(key => Object.prototype.hasOwnProperty.call(data, key) &&
        (!Array.isArray(data[key]) || data[key].some(record => !record || typeof record !== 'object' || Array.isArray(record)))) ||
        (Object.prototype.hasOwnProperty.call(data, 'cfg') && (!data.cfg || typeof data.cfg !== 'object' || Array.isArray(data.cfg)))) {
      pendingImport = null;
      alert('File sao lưu có nhóm dữ liệu không đúng định dạng.');
      return;
    }
    const summary = `<p class="text-slate-600">File: ${esc(file.name)} · ${data.people.length} người</p>
      <p class="text-slate-500">Chọn thay thế toàn bộ hoặc gộp vào dữ liệu hiện tại. Trước khi áp dụng, ứng dụng sẽ tải một bản sao lưu dự phòng.</p>
      <div class="grid grid-cols-2 gap-2"><button onclick="applyImport('replace')" class="bg-rose-600 text-white font-semibold py-2.5 rounded-xl">Thay thế</button>
      <button onclick="applyImport('merge')" class="bg-blue-600 text-white font-semibold py-2.5 rounded-xl">Gộp dữ liệu</button></div>`;
    showM(mhead('Nhập bản sao lưu') + summary);
  };
  rd.onerror = () => alert('Không đọc được file sao lưu. Hãy thử chọn lại file.');
  rd.readAsText(file);
}
function applyImport(mode) {
  if (!pendingImport) return;
  const locked = Object.keys(S.cfg.dayClosures).find(isDayLocked);
  if (locked) { rejectLockedDay(locked); return; }
  const data = pendingImport, preview = mode === 'merge' ? makeMergePlan(data) : null;
  if (!confirm(importSummary(mode, preview, data))) return;
  const backup = prepareBackup();
  downloadBlob(backup.blob, `prdcv-du-phong-truoc-khi-nhap-${today()}.json`);
  commitBackup(backup);
  const backupTime = S.backup;
  if (mode === 'replace') {
    const syncMeta = cloneRecord(S.syncMeta), deleted = [...S.deleted, ...(Array.isArray(data.deleted) ? data.deleted : [])];
    S = { ...seed(), ...data, deleted, syncMeta, backup: backupTime, backupPeopleCount: 0, peopleAddedSinceBackup: 0, undoStack: [], schemaVersion: SCHEMA_VERSION };
    migrate(false);
  } else {
    const plan = makeMergePlan(data);
    Object.keys(plan.groups).forEach(key => { S[key] = plan.groups[key].records; });
    if (plan.useIncomingConfig) S.cfg = { ...S.cfg, ...data.cfg };
    S.peopleAddedSinceBackup = (S.peopleAddedSinceBackup || 0) + plan.groups.people.counts.added;
  }
  migrate(false);
  S.backupPeopleCount = S.people.length;
  logActivity('Nhập sao lưu', mode === 'replace' ? 'Thay thế dữ liệu bằng file sao lưu' : 'Gộp dữ liệu từ file sao lưu');
  pendingImport = null;
  save(); closeM(); render();
}
function resetAll() {
  const locked = Object.keys(S.cfg.dayClosures).find(isDayLocked);
  if (locked) { rejectLockedDay(locked); return; }
  if (confirm('Xóa TOÀN BỘ dữ liệu? Không thể hoàn tác.') && confirm('Chắc chắn xóa?')) {
    const syncMeta = cloneRecord(S.syncMeta), deleted = cloneRecord(S.deleted);
    S = seed(); S.deleted = deleted; S.syncMeta = syncMeta; S.activity = [];
    logActivity('Xóa toàn bộ dữ liệu', 'Đã khởi tạo lại dữ liệu trên thiết bị');
    save(); closeM(); render();
  }
}

function requestPersistentStorage() {
  if (!navigator.storage || typeof navigator.storage.persist !== 'function') return;
  navigator.storage.persist().then(persisted => {
    if (!persisted) console.info('Trình duyệt chưa cấp lưu trữ bền vững.');
  }, error => console.warn('Không yêu cầu được lưu trữ bền vững:', error));
}
render();
updateSaveStatus();
requestPersistentStorage();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { scope: './' })
    .catch(error => console.error('Không đăng ký được service worker:', error));
}
</script>
